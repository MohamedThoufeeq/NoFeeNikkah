        country:
          type: string
        state:
          type: string
        city:
          type: string
        permanentCountry:
          type: string
        permanentState:
          type: string
        permanentCity:
          type: string
        ethnicity:
          type: array
          items:
            type: string
        education:
          type: string
        ugCourse:
          type: string
        pgCourse:
          type: string
        occupations:
          type: array
