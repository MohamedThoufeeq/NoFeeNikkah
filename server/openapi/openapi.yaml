paths:
  /health:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Returns process liveness information without touching the database.
        This endpoint is intentionally outside the API rate limiter and is
        suitable for container liveness probes.

        The same response is also available at `GET /api/health`.
      security: []
      responses:
        '200':
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                success: true
                data:
                  status: ok
                  uptime: 3600
                  timestamp: '2026-10-20T10:00:00.000Z'
                  version: 1.0.0
        '500':
          $ref: '#/components/responses/InternalError'

  /api/health:
    get:
      tags: [Health]
      operationId: getApiLiveness
      summary: Liveness probe (API prefix)
      description: |
        Alias of `GET /health` for deployments that route all traffic through
        the `/api` prefix. It does not query Supabase.
      security: []
      responses:
        '200':
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/health/db:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Verifies that the Supabase Postgres database is reachable by issuing a
        lightweight query against the `profiles` table. Use this for readiness
        probes, not liveness probes.

        Returns `503 SERVICE_UNAVAILABLE` if the database cannot be reached.
      security: []
      responses:
        '200':
          description: The database is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                success: true
                data:
                  status: ready
                  database: connected
                  timestamp: '2026-10-20T10:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/auth/providers:
    get:
      tags: [Auth]
      operationId: getAuthProviders
      summary: List configured social providers
      description: |
        Returns the OAuth provider identifiers accepted by the API's social
        token-exchange endpoint. The list comes from the server
        `SOCIAL_PROVIDERS` environment variable (default: `google,github`).

        Enabling a provider still requires configuration in Supabase Auth.
      security: []
      responses:
        '200':
          description: Configured provider identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
              example:
                success: true
                data:
                  providers: [google, github]
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account and profile
      description: |
        Creates a Supabase Auth user and a matching profile.

        Behavior:

        1. Rejects a username that is already taken (case-insensitive).
        2. Calls Supabase `signUp`. If email confirmation is enabled, Supabase
           sends the confirmation email and no session is returned.
        3. Creates the profile row. If profile creation fails for a newly
           created auth identity, the API deletes the auth user as a
           compensating action.
        4. If Supabase returns a provider session (email confirmation
           disabled), the API also creates an application session and sets the
           HTTP-only session cookie.

        Passwords must be 8–128 characters. Usernames must be 3–30 characters
        and may contain letters, numbers and underscores only.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: aisha_r
              email: aisha@example.com
              password: at-least-8-chars
              fullName: Aisha Rahman
      responses:
        '201':
          description: |
            Account created. `requiresEmailConfirmation` indicates whether the
            user must confirm their email before signing in. A `session` object
            is present only when the API was able to sign the user in
            immediately.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
              example:
                success: true
                data:
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    email: aisha@example.com
                    username: aisha_r
                    fullName: Aisha Rahman
                    image: ''
                  requiresEmailConfirmation: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Verifies credentials with Supabase, ensures a profile exists (creating
        one for users who authenticated before the profile existed), and issues
        an opaque application session.

        The response body contains the session token for bearer clients, and
        the response also sets the HTTP-only `nfn_session` cookie for browser
        clients.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: aisha@example.com
              password: your-password
      responses:
        '200':
          description: Signed in successfully.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                data:
                  token: 8G1s4vQ0c2b9Qh2m9d7pXr3tYk5nW1zL
                  expiresAt: '2026-11-19T10:00:00.000Z'
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    email: aisha@example.com
                    username: aisha_r
                    fullName: Aisha Rahman
                    image: ''
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/auth/social:
    post:
      tags: [Auth]
      operationId: socialLogin
      summary: Exchange a Supabase OAuth token for an application session
      description: |
        Social sign-in is a two-step flow:

        1. The browser uses the Supabase JS client to perform the OAuth redirect
           and receives a Supabase **access token** at the client callback URL.
        2. The browser posts that access token here. The API verifies it with
           Supabase, ensures a profile exists, creates an application session,
           and returns the same payload as password login.

        The API never accepts or stores a Supabase refresh token. Provider
        availability is configured in Supabase and exposed by
        `GET /api/auth/providers`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
            example:
              accessToken: supabase-access-token-from-oauth-callback
      responses:
        '200':
          description: Social identity verified and application session created.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      description: |
        Revokes the session token supplied by bearer header or cookie and
        clears the session cookie. This endpoint intentionally does not require
        a valid session, so logout succeeds even when the session has already
        expired.
      security:
        - {}
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Logout completed. The cookie is cleared even if no token was present.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                success: true
                data:
                  loggedOut: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentSession
      summary: Get the authenticated user and profile
      description: |
        Returns the current application session details, the authenticated
        user summary, and the owner's full profile including unmasked contact
        numbers.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Current session and private profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSessionResponse'
              example:
                success: true
                data:
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    email: aisha@example.com
                    username: aisha_r
                    fullName: Aisha Rahman
                    image: ''
                  profile: *profileExample
                  expiresAt: '2026-11-19T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/session:
    get:
      tags: [Auth]
      operationId: getSessionAlias
      summary: Get the authenticated session (alias)
      description: |
        Alias of `GET /api/auth/me`, retained for clients that use a
        `/session` path.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Current session and private profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Revoke every session for the user
      description: |
        Revokes all active sessions belonging to the authenticated user and
        clears the current session cookie. Useful after a password change or
        when a user suspects account compromise.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: All sessions revoked.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                success: true
                data:
                  loggedOut: true
                  revokedSessions: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/account:
    delete:
      tags: [Auth]
      operationId: deleteAccount
      summary: Delete the authenticated account
      description: |
        Revokes all sessions, deletes the Supabase auth user, and cascades
        deletion to the profile and interests. This is a destructive operation
        and cannot be undone.

        To delete only the profile row while keeping the auth account, use
        `DELETE /api/profiles/me`.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Account deleted.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
              example:
                success: true
                data:
                  deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/profiles/me:
    get:
      tags: [Profiles]
      operationId: getMyProfile
      summary: Get the authenticated user's full profile
      description: |
        Returns the caller's profile in the owner view. Contact numbers are
        unmasked and every profile field is present. Unset scalar values are
        empty strings; unset numeric values are `null`; unset list values are
        empty arrays.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              example:
                success: true
                data: *profileExample
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Profiles]
      operationId: updateMyProfile
      summary: Partially update the authenticated user's profile
      description: |
        Applies a partial profile update. The service merges the supplied fields
        with the existing profile, so omitted fields are preserved.

        Identity fields are immutable through this endpoint: `id`, `username`
        and `email` are always taken from the authenticated account regardless
        of the request body.

        The payload accepts both the canonical camelCase names documented in
        `ProfileUpdateRequest` and legacy aliases used by the existing React
        client. Unknown fields pass validation but are ignored by the domain
        model.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
            example:
              fullname: Aisha Rahman
              gender: female
              dateOfBirth: '1997-04-12'
              languagesKnownArray: [English, Tamil]
              occupationArray: [Engineer]
              country: India
              state: Tamil Nadu
              city: Chennai
              permanentCountry: India
              aboutMe: I am looking for a practising Muslim partner.
              isPublic: true
      responses:
        '200':
          description: Updated profile in the owner view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Profiles]
      operationId: replaceMyProfile
      summary: Update the authenticated user's profile
      description: |
        Alias of `PATCH /api/profiles/me`. The current implementation performs
        a merge rather than a destructive replace, so fields omitted from the
        body are preserved.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile in the owner view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Profiles]
      operationId: deleteMyProfile
      summary: Delete the authenticated user's profile row
      description: |
        Deletes only the `profiles` row. The Supabase auth account remains and
        a new profile may be created automatically on the next successful
        login.

        To delete the entire account, use `DELETE /api/auth/account`.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Profile deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
              example:
                success: true
                data:
                  deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/filter:
    get:
      tags: [Search]
      operationId: searchProfiles
      summary: Search public profiles
      description: |
        Searches public profiles using the database `search_profiles` function.
        Private profiles are never returned.

        Authentication is optional. When a valid session is supplied, the
        caller's own profile is excluded and the caller's public-profile view
        is still limited to public data. An invalid session token returns 401
        rather than silently falling back to guest mode.

        Filters:

        - `minAge` and `age` form an inclusive age range; `age` is the
          **maximum** age for backwards compatibility.
        - `income` is a **maximum monthly** income.
        - `language` and `occupation` perform case-insensitive partial matching
          inside the corresponding arrays.
        - `gender=both` (or omission) does not filter by gender.
        - Location, marital status, sect, education, eating habits, practicing
          level, smoking/drinking and financial status are exact matches.

        The response contains summary profiles, not the full profile object.
      security:
        - {}
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GenderFilter'
        - $ref: '#/components/parameters/CountryFilter'
        - $ref: '#/components/parameters/StateFilter'
        - $ref: '#/components/parameters/CityFilter'
        - $ref: '#/components/parameters/LanguageFilter'
        - $ref: '#/components/parameters/OccupationFilter'
        - $ref: '#/components/parameters/MinAge'
        - $ref: '#/components/parameters/MaxAge'
        - $ref: '#/components/parameters/MaxIncome'
        - $ref: '#/components/parameters/MaritalStatusFilter'
        - $ref: '#/components/parameters/SectFilter'
        - $ref: '#/components/parameters/EducationFilter'
        - $ref: '#/components/parameters/EatingHabitsFilter'
        - $ref: '#/components/parameters/PracticingLevelFilter'
        - $ref: '#/components/parameters/SmokingDrinkingFilter'
        - $ref: '#/components/parameters/FinancialStatusFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of public profile summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              example:
                success: true
                data:
                  profiles:
                    - id: 22222222-2222-4222-8222-222222222222
                      username: fatima_s
                      fullName: Fatima S.
                      gender: female
                      dateOfBirth: '1998-08-01'
                      age: 28
                      maritalStatus: single
                      country: India
                      state: Tamil Nadu
                      city: Chennai
                      languages: [English, Tamil]
                      occupations: [Doctor]
                      income: 100000
                      education: pg
                      aboutMe: Looking for a kind and practising partner.
                      myExpectation: Mutual respect and deen.
                      image: ''
                      isPublic: true
                  pagination:
                    page: 1
                    limit: 20
                    total: 1
                    totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/search:
    get:
      tags: [Search]
      operationId: searchProfilesAlias
      summary: Search public profiles (alias)
      description: |
        Alias of `GET /api/filter`. Both routes use the same validation and
        response contract.
      security:
        - {}
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GenderFilter'
        - $ref: '#/components/parameters/CountryFilter'
        - $ref: '#/components/parameters/StateFilter'
        - $ref: '#/components/parameters/CityFilter'
        - $ref: '#/components/parameters/LanguageFilter'
        - $ref: '#/components/parameters/OccupationFilter'
        - $ref: '#/components/parameters/MinAge'
        - $ref: '#/components/parameters/MaxAge'
        - $ref: '#/components/parameters/MaxIncome'
        - $ref: '#/components/parameters/MaritalStatusFilter'
        - $ref: '#/components/parameters/SectFilter'
        - $ref: '#/components/parameters/EducationFilter'
        - $ref: '#/components/parameters/EatingHabitsFilter'
        - $ref: '#/components/parameters/PracticingLevelFilter'
        - $ref: '#/components/parameters/SmokingDrinkingFilter'
        - $ref: '#/components/parameters/FinancialStatusFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of public profile summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/profiles/{id}:
    get:
      tags: [Profiles]
      operationId: getProfileById
      summary: Get a public profile by id
      description: |
        Returns a profile if it is public. If the profile is private and the
        caller is not its owner, the API returns `404 NOT_FOUND` to avoid
        leaking the profile's existence.

        Authentication is optional. When the caller is the owner, the response
        is the full owner view with unmasked contact numbers. Other members and
        guests receive masked contact numbers.
      security:
        - {}
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Public profile, or the owner's full profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/interests:
    post:
      tags: [Interests]
      operationId: sendInterest
      summary: Send an interest to a profile
      description: |
        Creates a pending interest from the authenticated user to
        `targetProfileId`.

        Rules:

        - The sender is always taken from the session; it cannot be supplied in
          the body.
        - The target must exist.
        - You cannot send an interest to your own profile.
        - A sender can send only one interest to the same target. A duplicate
          returns `409 CONFLICT`.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInterestRequest'
            example:
              targetProfileId: 22222222-2222-4222-8222-222222222222
      responses:
        '201':
          description: Interest created with `pending` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestResponse'
              example:
                success: true
                data:
                  id: 33333333-3333-4333-8333-333333333333
                  sender_id: 11111111-1111-4111-8111-111111111111
                  target_id: 22222222-2222-4222-8222-222222222222
                  status: pending
                  created_at: '2026-10-20T10:00:00.000Z'
                  updated_at: '2026-10-20T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/interests/sent:
    get:
      tags: [Interests]
      operationId: listSentInterests
      summary: List interests sent by the caller
      description: |
        Returns all interests where the authenticated user is the sender,
        ordered by creation time descending. Rows are returned in their
        database shape (snake_case) for compatibility.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Interests sent by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/interests/received:
    get:
      tags: [Interests]
      operationId: listReceivedInterests
      summary: List interests received by the caller
      description: |
        Returns all interests where the authenticated user is the target,
        ordered by creation time descending. Only the recipient may accept or
        decline these interests.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: Interests received by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/interests/{id}:
    patch:
      tags: [Interests]
      operationId: updateInterestStatus
      summary: Accept or decline a received interest
      description: |
        Updates the status of an interest. Only the recipient can perform this
        action. The repository scopes the update to `target_id = current user`,
        so a sender cannot accept their own sent interest.

        Allowed statuses are `accepted` and `declined`. New interests start as
        `pending`.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InterestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInterestStatusRequest'
            example:
              status: accepted
      responses:
        '200':
          description: Updated interest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Interests]
      operationId: withdrawInterest
      summary: Withdraw a sent interest
      description: |
        Deletes an interest. Only the sender can withdraw an interest. The
        repository scopes the delete to `sender_id = current user`; recipients
        should use `PATCH` to accept or decline instead.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InterestId'
      responses:
        '200':
          description: Interest withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
              example:
                success: true
                data:
                  deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/{id}/senInterest/{targetId}:
    post:
      tags: [Legacy]
      operationId: legacySendInterest
      summary: Send an interest (legacy route)
      description: |
        Legacy endpoint retained for the existing React client. The `id` path
        parameter must equal the authenticated user's id; the target is taken
        from `targetId`.

        **Deprecated:** use `POST /api/interests` with
        `{ "targetProfileId": "..." }`.
      deprecated: true
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LegacySenderId'
        - $ref: '#/components/parameters/LegacyTargetId'
      responses:
        '201':
          description: Interest created with `pending` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/{id}:
    post:
      tags: [Legacy]
      operationId: legacyUpdateProfile
      summary: Update a profile (legacy route)
      description: |
        Legacy endpoint retained for the existing React client. The `id` path
        parameter must equal the authenticated user's id. The body accepts the
        same fields as `PATCH /api/profiles/me`.

        **Deprecated:** use `PATCH /api/profiles/me`.
      deprecated: true
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LegacySenderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile in the owner view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
      description: |
        Opaque application session token returned by login, register or social
        sign-in. Send it as `Authorization: Bearer <token>`.

        This is not a Supabase access token or a JWT. Session lifetime is
        controlled by `SESSION_TTL_DAYS`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: nfn_session
      description: |
        HTTP-only session cookie set on successful login/register/social
        sign-in. The cookie name is configurable with `SESSION_COOKIE_NAME`.
        Browser clients may use this instead of the bearer token.

        The cookie is `Secure` in production, uses `SameSite` from
        `COOKIE_SAME_SITE` (default `lax`), and is cleared on logout.

  parameters:
    ProfileId:
      name: id
      in: path
      required: true
      description: Profile UUID. Profile ids are Supabase auth user ids.
      schema:
        type: string
        format: uuid
      example: 22222222-2222-4222-8222-222222222222

    InterestId:
      name: id
      in: path
      required: true
      description: Interest UUID.
      schema:
        type: string
        format: uuid
      example: 33333333-3333-4333-8333-333333333333

    LegacySenderId:
      name: id
      in: path
      required: true
      description: |
        Authenticated sender's profile UUID. Must equal the session user id.
      schema:
        type: string
        format: uuid
      example: 11111111-1111-4111-8111-111111111111

    LegacyTargetId:
      name: targetId
      in: path
      required: true
      description: Target profile UUID.
      schema:
        type: string
        format: uuid
      example: 22222222-2222-4222-8222-222222222222

    GenderFilter:
      name: gender
      in: query
      required: false
      description: |
        Filter by gender. Omit or use `both` for no gender filter.
      schema:
        type: string
        enum: [male, female, both]

    CountryFilter:
      name: country
      in: query
      required: false
      description: Exact country match.
      schema:
        type: string
        maxLength: 100

    StateFilter:
      name: state
      in: query
      required: false
      description: Exact state match.
      schema:
        type: string
        maxLength: 100

    CityFilter:
      name: city
      in: query
      required: false
      description: Exact city match.
      schema:
        type: string
        maxLength: 100

    LanguageFilter:
      name: language
      in: query
      required: false
      description: |
        Case-insensitive partial match inside the profile's `languages` array.
      schema:
        type: string
        maxLength: 100

    OccupationFilter:
      name: occupation
      in: query
      required: false
      description: |
        Case-insensitive partial match inside the profile's `occupations` array.
      schema:
        type: string
        maxLength: 100

    MinAge:
      name: minAge
      in: query
      required: false
      description: Minimum age, inclusive.
      schema:
        type: integer
        minimum: 18
        maximum: 100
      example: 24

    MaxAge:
      name: age
      in: query
      required: false
      description: |
        Maximum age, inclusive. The name `age` is retained for backwards
        compatibility; use it together with `minAge` for an age range.
      schema:
        type: integer
        minimum: 18
        maximum: 100
      example: 32

    MaxIncome:
      name: income
      in: query
      required: false
      description: Maximum monthly income in INR, inclusive.
      schema:
        type: number
        minimum: 0
      example: 100000

    MaritalStatusFilter:
      name: maritalStatus
      in: query
      required: false
      description: Exact marital status match.
      schema:
        type: string
        enum: [single, married, divorcee, widow, widower]
      example: single

    SectFilter:
      name: sect
      in: query
      required: false
      description: Exact sect match using the canonical profile value.
      schema:
        type: string
        maxLength: 100
      example: pureSunni

    EducationFilter:
      name: education
      in: query
      required: false
      description: Exact education-level match.
      schema:
        type: string
        enum: [primary, secondary, higher, diploma, ug, pg, phd]
      example: pg

    EatingHabitsFilter:
      name: eatingHabits
      in: query
      required: false
      description: Exact eating-habits match.
      schema:
        type: string
        enum: [halal, any, veg, vegan]
      example: halal

    PracticingLevelFilter:
      name: practicingLevel
      in: query
      required: false
      description: Exact practicing-level match.
      schema:
        type: string
        enum: [excellent, veryHigh, high, medium, low, kafir]
      example: veryHigh

    SmokingDrinkingFilter:
      name: smokeAndDrink
      in: query
      required: false
      description: Exact smoking/drinking habit match.
      schema:
        type: string
        maxLength: 100
      example: haram

    FinancialStatusFilter:
      name: financialStatus
      in: query
      required: false
      description: Exact financial-status match.
      schema:
        type: string
        enum: [affluent, rich, upper, middle, lower, poor, no]
      example: middle

    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      description: Number of profiles per page. Capped at 100 by the API.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    RequestId:
      description: |
        Correlation identifier for this request. Mirrors the `requestId` field
        in error responses and is safe to log and report.
      schema:
        type: string
        description: |-
          Generated UUID, or a client-supplied value matching
          `[a-zA-Z0-9._-]{1,128}`.
    SetCookie:
      description: |
        Session cookie. On login/register/social responses it contains the new
        HTTP-only session token. On logout/logout-all/delete-account responses
        it clears the cookie.
      schema:
        type: string
    RateLimit:
      description: Current rate-limit counters.
      schema:
        type: string
    RateLimitPolicy:
      description: Rate-limit policy details.
      schema:
        type: string

  responses:
    BadRequest:
      description: The operation is invalid for the current state.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required or the session token is invalid/expired.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated, but not allowed to perform this action.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found, or a private profile hidden from this caller.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate username, email or interest.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request parameters, query or body failed validation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: The request body exceeds the configured body limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests in the current rate-limit window.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server failure. Details are logged but not exposed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Supabase/Auth or the database is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SuccessBase:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]
          description: Always `true` for successful responses.

    ErrorResponse:
      type: object
      required: [success, error, requestId]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              enum:
                - VALIDATION_ERROR
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
                - INVALID_JSON
                - PAYLOAD_TOO_LARGE
                - CORS_NOT_ALLOWED
                - AUTH_ERROR
            message:
              type: string
              description: Safe, human-readable error message.
            details:
              description: |
                Optional details. Validation errors contain an array of issue
                objects; other errors may contain a structured object or omit
                this field.
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ValidationIssue'
                - type: object
                  additionalProperties: true
        requestId:
          type: string
          description: Request correlation id. Also returned in `X-Request-Id`.
      example:
        success: false
        error:
          code: VALIDATION_ERROR
          message: Enter a valid email address.
          details:
            - path: email
              message: Enter a valid email address.
              code: invalid_format
        requestId: 9e4f8f7e-2b1d-4a9f-8f0b-3a7c1d2e4f56

    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: Dot-separated path of the invalid field.
        message:
          type: string
          description: Human-readable validation message.
        code:
          type: string
          description: Zod issue code, when available.

    User:
      type: object
      required: [id, email, username, fullName, image]
      properties:
        id:
          type: string
          format: uuid
          description: Supabase auth user id and profile id.
        email:
          type: string
          description: |-
            Account email. May be empty for a social identity without an email.
        username:
          type: string
          description: Public username.
        fullName:
          type: string
          description: Display name.
        image:
          type: string
          description: Profile image URL, or empty string.

    AuthSession:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: |
            Opaque application session token. Only its hash is stored by the
            API. Prefer the HTTP-only cookie in browsers.
        expiresAt:
          type: string
          format: date-time
          description: Session expiry timestamp.
        user:
          $ref: '#/components/schemas/User'

    RegistrationData:
      type: object
      required: [user, requiresEmailConfirmation]
      properties:
        user:
          $ref: '#/components/schemas/User'
        requiresEmailConfirmation:
          type: boolean
          description: |
            `true` when Supabase requires the user to confirm their email before
            signing in. In that case `session` is absent.
        session:
          allOf:
            - $ref: '#/components/schemas/AuthSession'
          description: |
            Present only when email confirmation is disabled and the API could
            create a session immediately.

    CurrentSessionData:
      type: object
      required: [user, profile, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        profile:
          $ref: '#/components/schemas/Profile'
        expiresAt:
          type: string
          format: date-time
          description: Current session expiry timestamp.

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
          description: |
            Public username. Case-insensitive uniqueness is enforced. Letters,
            numbers and underscores only.
          example: aisha_r
        email:
          type: string
          format: email
          description: Account email. Normalized to lowercase by the API.
          example: aisha@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Password, 8–128 characters.
        fullName:
          type: string
          maxLength: 120
          description: Optional display name. Defaults to the username.
          example: Aisha Rahman

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          description: |
            Password. Login validation intentionally does not enforce the
            registration minimum length so existing accounts with legacy
            passwords can still sign in.

    SocialLoginRequest:
      type: object
      additionalProperties: false
      required: [accessToken]
      properties:
        accessToken:
          type: string
          minLength: 20
          description: |
            Supabase access token obtained by the browser after the OAuth
            redirect. Never send a Supabase refresh token.

    ProfileUpdateRequest:
      type: object
      additionalProperties: true
      description: |
        Partial profile update. All fields are optional. Omitted fields are
        preserved. The API accepts canonical camelCase names below and the
        legacy aliases listed in `x-legacy-aliases`. Unknown fields are
        accepted by validation but ignored by the domain model.

        Identity fields `id`, `username` and `email` are read-only: the service
        always preserves the authenticated account's values.
      x-legacy-aliases:
        fullname: fullName
        name: fullName
        profileId: id
        languagesKnownArray: languages
        language: languages
        occupationArray: occupations
        occupation: occupations
        fatherOccupationArray: fatherOccupations
        fatherOccupation: fatherOccupations
        motherOccupationArray: motherOccupations
        motherOccupation: motherOccupations
        noOfBrother: noOfBrothers
        noOfSister: noOfSisters
        myInspirationArray: inspirations
        isPartnerProfessional: partnerProfessional
        fromAge: partnerFromAge
        toAge: partnerToAge
        partnersProfessionArray: partnerProfessions
        imageUrl: image
        image_url: image
        profileImage: image
        is_public: isPublic
        permenantCountry: permanentCountry
        permenantState: permanentState
        permenantCity: permanentCity
        partnersPreferredCountry: partnerCountry
        partnersPreferredState: partnerState
        partnersPreferredCity: partnerCity
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Ignored on update; the authenticated user id is used.
        username:
          type: string
          readOnly: true
          description: Ignored on update; the existing username is preserved.
        email:
          type: string
          format: email
          readOnly: true
          description: Ignored on update; the existing email is preserved.
        fullName:
          type: string
          maxLength: 120
        gender:
          type: string
          enum: [male, female, '']
        dateOfBirth:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Date in `YYYY-MM-DD` format, or an empty string to clear.
        bloodGroup:
          type: string
          maxLength: 5000
        maritalStatus:
          type: string
          maxLength: 5000
        children:
          type: string
          maxLength: 5000
        childrenCount:
          $ref: '#/components/schemas/NullableNumberInput'
        pwd:
          $ref: '#/components/schemas/YesNoInput'
        pwdType:
          type: string
          maxLength: 5000
        languages:
          $ref: '#/components/schemas/StringListInput'
        country:
          type: string
          maxLength: 5000
        state:
          type: string
          maxLength: 5000
        city:
          type: string
          maxLength: 5000
        permanentCountry:
          type: string
          maxLength: 5000
        permanentState:
          type: string
          maxLength: 5000
        permanentCity:
          type: string
          maxLength: 5000
        ethnicity:
          $ref: '#/components/schemas/StringListInput'
        education:
          type: string
          maxLength: 5000
        ugCourse:
          type: string
          maxLength: 5000
        pgCourse:
          type: string
          maxLength: 5000
        occupations:
          $ref: '#/components/schemas/StringListInput'
        income:
          $ref: '#/components/schemas/NullableNumberInput'
        company:
          type: string
          maxLength: 5000
        workLocation:
          type: string
          maxLength: 5000
        workExperience:
          $ref: '#/components/schemas/NullableNumberInput'
        fatherOccupations:
          $ref: '#/components/schemas/StringListInput'
        motherOccupations:
          $ref: '#/components/schemas/StringListInput'
        noOfBrothers:
          $ref: '#/components/schemas/NullableNumberInput'
        noOfSisters:
          $ref: '#/components/schemas/NullableNumberInput'
        financialStatus:
          type: string
          maxLength: 5000
        familyLivingIn:
          type: string
          maxLength: 5000
        mobileNumber:
          type: string
          maxLength: 30
        parent:
          type: string
          maxLength: 5000
        parentName:
          type: string
          maxLength: 5000
        parentNumber:
          type: string
          maxLength: 30
        socialLinks:
          type: string
          maxLength: 500
        aboutMe:
          type: string
          maxLength: 5000
        myExpectation:
          type: string
          maxLength: 5000
        quranVerse:
          type: string
          maxLength: 5000
        isRevert:
          $ref: '#/components/schemas/YesNoInput'
        revertedFrom:
          type: string
          maxLength: 5000
        startedPracticing:
          type: string
          maxLength: 5000
          description: |-
            Date-like text. Use `YYYY-MM-DD` or an empty string; the Postgres
            column is a `date`, so invalid non-empty values are rejected.
        sect:
          type: string
          maxLength: 5000
        salahPattern:
          type: string
          maxLength: 5000
        quranRead:
          type: string
          maxLength: 5000
        practicingLevel:
          type: string
          maxLength: 5000
        scholars:
          $ref: '#/components/schemas/StringListInput'
        inspirations:
