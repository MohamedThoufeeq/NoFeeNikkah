        - sender_id
        - target_id
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
          description: Profile id of the sender.
        target_id:
          type: string
          format: uuid
          description: Profile id of the recipient.
        status:
          type: string
          enum: [pending, accepted, declined]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

