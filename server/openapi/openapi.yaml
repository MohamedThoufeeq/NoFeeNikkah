    SendInterestRequest:
      type: object
      additionalProperties: false
      required: [targetProfileId]
      properties:
        targetProfileId:
          type: string
          format: uuid
          description: Profile to receive the interest. Cannot be your own profile.

    UpdateInterestStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, declined]
          description: Only the recipient may change an interest from `pending`.

    StringListInput:
      description: |
        List value. The client may send an array or a comma-separated string;
        the domain model normalizes either form.
      oneOf:
        - type: array
          items:
            oneOf:
              - type: string
              - type: number
        - type: string

    YesNoInput:
      description: |
        Yes/no value. Boolean values and `yes`/`no` strings are accepted;
        `true`/`false` strings are also accepted for legacy clients. `null` is
        accepted and preserves the existing value.
      oneOf:
        - type: boolean
        - type: string
          nullable: true
          enum: ['yes', 'no', 'true', 'false']

    NullableNumberInput:
      description: |
        Numeric value that may be sent as a JSON number or numeric string. An
        empty string or `null` is treated as omitted and preserves the existing
        value rather than clearing it.
      oneOf:
        - type: number
        - type: string
          nullable: true

