openapi: 3.0.3
info:
  title: NoFeeNikkah API
  version: 1.0.0
  description: |
    # NoFeeNikkah API

    Backend API for the NoFeeNikkah Muslim matrimonial platform. The API is
    built with Node.js and Express 5, uses Supabase Auth for identity and
    Supabase Postgres for persistence, and issues its own opaque server-side
    sessions.

    ## Base URLs

    - Local development: `http://localhost:8080`
    - Production: replace the placeholder server URL with your deployed API
      origin.

    Health endpoints are available at both `/health` and `/api/health`. All
    business endpoints are under `/api`.

    ## Authentication

    Protected endpoints accept either credential:

    1. **HTTP-only session cookie** — `nfn_session` by default. The cookie is
       set by register/login/social-login and cleared by logout.
    2. **Bearer token** — `Authorization: Bearer <opaque-session-token>`. The
       token is returned in the login/register/social response body for mobile
       and legacy clients.

    The token is a random opaque value generated by this API. Only its SHA-256
    hash is stored in the `sessions` table. It is **not** a Supabase access
    token or a JWT. Supabase refresh tokens are never stored or returned.

    Public reads (`GET /api/profiles/{id}`, `/api/filter`, `/api/search`)
    optionally accept a session. Guests see public profiles only; signed-in
    users additionally get owner-only contact details on their own profile and
    have their own profile excluded from search.

    ## Response envelope

    Every JSON response uses the same envelope:

    ```json
    { "success": true, "data": {} }
    ```

    Errors use:

    ```json
    {
      "success": false,
      "error": {
        "code": "VALIDATION_ERROR",
        "message": "Enter a valid email address.",
        "details": []
      },
      "requestId": "..."
    }
    ```

    The `X-Request-Id` response header is always set. Clients may send their own
    `X-Request-Id` header to correlate logs.

    ## Errors and validation

    - Zod validation failures return `422 VALIDATION_ERROR`.
    - Missing or expired sessions return `401 UNAUTHORIZED`.
    - Permission failures return `403 FORBIDDEN`.
    - Private profiles are intentionally indistinguishable from missing
      profiles and return `404 NOT_FOUND` to other members.
    - Database details and provider internals are never exposed in production.

    ## Rate limiting

    All business `/api` requests share a global limit (`RATE_LIMIT_MAX`,
    default 300 per 15 minutes). Health probes are excluded. Authentication
    endpoints have a stricter limit (`AUTH_RATE_LIMIT_MAX`, default 15 per 15
    minutes). Rate-limit metadata is returned in the `RateLimit` and
    `RateLimit-Policy` headers; exceeding a limit returns `429 RATE_LIMITED`.

    ## Privacy

    - Full mobile/parent numbers are returned only from `GET /api/profiles/me`
      and to the profile owner.
    - Other members receive masked contact numbers.
    - Search returns only public profiles and a summary object, not the full
      profile.
    - Private profiles return 404 unless requested by their owner.

    ## Legacy compatibility

    Two legacy routes are retained for the existing React client and marked
    `deprecated` in this document:

    - `POST /api/{id}/senInterest/{targetId}`
    - `POST /api/{id}`

    New clients should use `POST /api/interests` and
    `PATCH /api/profiles/me` instead.
  contact:
    name: NoFeeNikkah API maintainers

servers:
  - url: http://localhost:8080
    description: Local development API. Replace this URL with your deployed API origin.

tags:
  - name: Health
    description: Liveness and readiness probes.
  - name: Auth
    description: Registration, login, social token exchange and session lifecycle.
  - name: Profiles
    description: Profile reads, updates and account profile deletion.
  - name: Search
    description: Public profile discovery with optional authenticated filtering.
  - name: Interests
    description: Sending, listing, accepting, declining and withdrawing interests.
  - name: Legacy
    description: Deprecated routes retained for the existing client.

security:
  - bearerAuth: []
  - sessionCookie: []

